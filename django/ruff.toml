# Python lint and format rules, run by CI (`ruff check` and `ruff format --check`).
target-version = "py313"
line-length = 120
extend-exclude = ["**/migrations/**"]

[lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import order
  "B",        # bugbear
  "UP",       # pyupgrade
  "DJ",       # django
  "SIM",      # simplify
  "RUF",      # ruff-specific
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Ukrainian copy legitimately uses «», —, ’
  "RUF012",                      # Django Meta/admin class attributes are fine as lists
]

[lint.isort]
known-first-party = ["config", "main"]
